name: Manual WhatsApp Version Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Update WhatsApp Web Version
        id: update_version
        run: npm run update:version

      - name: Rebuild ESM and CommonJS outputs
        run: npm run build:dual

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="update-version/stable"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if branch exists and delete it
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          # Create new branch, commit, and push
          git checkout -b "$BRANCH_NAME"
          git add src/Defaults/baileys-version.json src/Defaults/index.ts src/Utils/generics.ts lib/Defaults/index.js lib/Utils/generics.js cjs/lib/Defaults/index.js cjs/lib/Utils/generics.js
          git commit -m "chore: update WhatsApp Web version"
          git push origin "$BRANCH_NAME"

          # Create PR using GitHub CLI
          gh pr create \
            --title "chore: update WhatsApp Web version" \
            --body "Manual WhatsApp Web version update. It does not regenerate WAProto; prefer the Update WAProto workflow for coordinated schema and version changes.

          This PR updates the WhatsApp Web client revision to the latest version fetched from \`web.whatsapp.com\`.

          **Files updated:**
          - \`src/Defaults/baileys-version.json\`
          - \`src/Defaults/index.ts\`
          - \`src/Utils/generics.ts\`" \
            --base main \
            --head "$BRANCH_NAME" || echo "PR already exists or could not be created"
