name: Linting Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Check linting
        run: npm run lint
