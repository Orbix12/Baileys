name: Publish VamXRepan Baileys 1.0.0

on:
  push:
    tags:
      - 'v1.0.0'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Verify immutable package version and tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          test "$VERSION" = '1.0.0'
          test "$PACKAGE_NAME" = '@vamxrepan/baileys'
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run check:types

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build ESM and CommonJS
        run: npm run build:dual

      - name: Stage the exact npm tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          PACKAGE_TARBALL="$(find dist -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$PACKAGE_TARBALL"
          sha256sum "$PACKAGE_TARBALL" | tee "$PACKAGE_TARBALL.sha256"
          echo "package_tarball=$PACKAGE_TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish the staged tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.package_tarball }}" --access public --tag latest

      - name: Create GitHub Release with the same tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.pack.outputs.package_tarball }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PACKAGE_TARBALL" \
            "$PACKAGE_TARBALL.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'VamXRepan Baileys 1.0.0' \
            --notes-file CHANGELOG.md
